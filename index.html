<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />

    <!-- Default SEO (overridden per-route by react-helmet-async) -->
    <title>SomaLab | Evidence-Based Nutrition Coaching Australia</title>
    <meta
      name="description"
      content="Personalised, science-backed nutrition coaching for sustainable fat loss, peak performance, and total wellbeing. Serving Brisbane, Gold Coast & Australia-wide."
    />
    <meta name="author" content="SomaLab" />
    <meta
      name="keywords"
      content="nutrition consultant Australia, nutrition coach Brisbane, nutrition coach Gold Coast, personalised nutrition coaching, evidence-based nutrition, weight loss consultant, sports nutrition, biomarker analysis, wellness coaching Australia, SomaLab"
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="geo.region" content="AU-QLD" />
    <meta name="geo.placename" content="Brisbane" />
    <link rel="canonical" href="https://somalab.com.au/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://somalab.com.au/" />
    <meta property="og:title" content="SomaLab | Evidence-Based Nutrition Coaching Australia" />
    <meta
      property="og:description"
      content="Personalised, science-backed nutrition coaching for sustainable fat loss, peak performance, and genuine wellbeing."
    />
    <meta property="og:image" content="https://somalab.com.au/og-image.jpg" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:site_name" content="SomaLab" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SomaLab | Nutrition Consultant Australia" />
    <meta
      name="twitter:description"
      content="Evidence-based nutrition coaching for sustainable health results. Brisbane, Gold Coast & Australia-wide."
    />
    <meta name="twitter:image" content="https://somalab.com.au/og-image.jpg" />

    <!-- Performance: preconnect & DNS prefetch -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Sitemap discovery -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Site-wide LocalBusiness JSON-LD is injected per-route by the SEO component (see src/lib/seo-config.ts) -->

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
